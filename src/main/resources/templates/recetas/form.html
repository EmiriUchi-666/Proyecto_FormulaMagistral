<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout('Receta', 'recetas/form')}">
<body>
<main th:fragment="content">
    <h4 class="mb-4">Nueva Receta</h4>
    <div class="card border-0 shadow-sm p-4" style="max-width: 600px;">
        <form th:action="@{/app/recetas/guardar}" method="post">
            <div class="mb-3">
                <label class="form-label">Cliente</label>
                <select class="form-select" name="idPaciente" required>
                    <option value="">Seleccione un cliente</option>
                    <option th:each="p : ${clientes}" th:value="${p.idPaciente}" th:text="${p.nombres} + ' ' + ${p.apellidos}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Médico</label>
                <input type="text" class="form-control" name="medico" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Cita Médica relacionada (opcional)</label>
                <select class="form-select" name="idCita">
                    <option value="">Sin cita relacionada</option>
                    <option th:each="c : ${citas}" th:value="${c.idCita}" th:text="${c.motivo} + ' — ' + ${c.fechaHora}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">N° de Colegiatura</label>
                <input type="text" class="form-control" name="numColegiatura">
            </div>
            <div class="mb-3">
                <label class="form-label">Fecha de Emisión</label>
                <input type="date" class="form-control" name="fechaEmision" required>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">Guardar</button>
                <a th:href="@{/app/recetas}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</main>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
