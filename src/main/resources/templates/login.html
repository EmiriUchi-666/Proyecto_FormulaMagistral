<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FarmaPrep · Iniciar sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link th:href="@{/css/app.css}" rel="stylesheet">
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'light');</script>
</head>
<body class="login-bg d-flex align-items-center justify-content-center">
  <div class="card shadow-lg border-0" style="width:100%;max-width:420px">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <i class="bi bi-capsule text-success" style="font-size:3rem"></i>
        <h3 class="fw-bold mt-2">FarmaPrep</h3>
        <p class="text-body-secondary small">Sistema de fórmulas magistrales</p>
      </div>
      <div th:if="${param.error}" class="alert alert-danger py-2 small"><i class="bi bi-exclamation-triangle"></i> Correo o contraseña incorrectos</div>
      <div th:if="${param.logout}" class="alert alert-success py-2 small"><i class="bi bi-check-circle"></i> Sesión cerrada correctamente</div>
      <form th:action="@{/app/login}" method="post">
        <div class="form-floating mb-3">
          <input type="email" class="form-control" id="username" name="username" placeholder="admin@farmaprep.pe" required autofocus>
          <label for="username"><i class="bi bi-envelope"></i> Correo electrónico</label>
        </div>
        <div class="form-floating mb-4">
          <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" required>
          <label for="password"><i class="bi bi-lock"></i> Contraseña</label>
        </div>
        <button type="submit" class="btn btn-success w-100 py-2">Ingresar</button>
      </form>
      <p class="text-center small text-muted mt-3 mb-0">
        Usuario de prueba: <code>admin@farmaprep.pe</code> / <code>admin123</code>
      </p>
    </div>
  </div>
</body>
</html>
