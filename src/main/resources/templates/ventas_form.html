<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout('Venta', 'ventas')}">
<body>
<main th:fragment="content">
    <h4 class="mb-4">Nueva Venta</h4>
    <div class="card border-0 shadow-sm p-4" style="max-width: 600px;">
        <form th:action="@{/ventas/guardar}" th:object="${venta}" method="post">
            <div class="mb-3">
                <label class="form-label">Cliente</label>
                <select class="form-select" th:field="*{cliente}" required>
                    <option value="">Seleccione un cliente</option>
                    <option th:each="c : ${clientes}" th:value="${c}" th:text="${c}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Total</label>
                <input type="number" step="0.01" class="form-control" th:field="*{total}" required>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">Guardar</button>
                <a th:href="@{/ventas}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
