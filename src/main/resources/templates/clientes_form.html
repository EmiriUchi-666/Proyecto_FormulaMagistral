<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es" 
      th:replace="~{layout/main :: layout('Cliente', 'clientes')}">
<head>
    <title>Cliente | FarmaPrep</title>
</head>
<body>
<main th:fragment="content">
    <h4 class="mb-4" th:text="${cliente.id != null} ? 'Editar Cliente' : 'Nuevo Cliente'">Título</h4>
    <div class="card border-0 shadow-sm p-4" style="max-width: 600px;">
        <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">
                <label for="numDocumento" class="form-label">N° Documento</label>
                <input type="text" class="form-control" id="numDocumento" th:field="*{num_documento}" required>
            </div>
            <div class="mb-3">
                <label for="nombres" class="form-label">Nombres Completos</label>
                <input type="text" class="form-control" id="nombres" th:field="*{nombres}" required>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">Guardar</button>
                <a th:href="@{/clientes}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
