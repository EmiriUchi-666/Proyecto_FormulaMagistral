<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ticket de Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        @media print {
            .no-print { display: none !important; }
            body { margin: 0; padding: 20px; }
        }
        .ticket-print {
            max-width: 300px;
            margin: 0 auto;
            border: 1px dashed #000;
            padding: 20px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="no-print mb-3 text-center">
            <button onclick="window.print()" class="btn btn-success">
                <i class="bi bi-printer"></i> Imprimir
            </button>
            <a th:href="@{/ventas}" class="btn btn-outline-secondary">Volver</a>
        </div>
        <div class="ticket-print">
            <div class="text-center mb-3">
                <h5 class="fw-bold">FarmaPrep</h5>
                <small>Sistema de Fórmulas Magistrales</small>
            </div>
            <hr>
            <div class="mb-2">
                <strong>Ticket:</strong> <span th:text="${venta.id}"></span><br>
                <strong>Fecha:</strong> <span th:text="${venta.fecha}"></span><br>
                <strong>Cliente:</strong> <span th:text="${venta.cliente}"></span>
            </div>
            <hr>
            <div class="mb-2">
                <strong>Productos:</strong>
                <ul class="list-unstyled small mt-2">
                    <li th:each="item : ${items}" class="d-flex justify-content-between">
                        <span th:text="${item.producto}"></span>
                        <span th:text="'S/ ' + ${item.precio}"></span>
                    </li>
                </ul>
            </div>
            <hr>
            <div class="text-center">
                <strong class="fs-5">TOTAL: <span th:text="'S/ ' + ${venta.total}"></span></strong>
            </div>
            <hr>
            <div class="text-center small">
                <p>¡Gracias por su compra!</p>
            </div>
        </div>
    </div>
</body>
</html>
