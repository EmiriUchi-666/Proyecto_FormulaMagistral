<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="es"
      th:replace="~{layout/main :: layout(${cliente.id} != null ? 'Editar Cliente' : 'Nuevo Cliente', 'clientes/form')}">
<body>
<main th:fragment="content">
    <h4 class="mb-4" th:text="${cliente.id} != null ? 'Editar Cliente' : 'Nuevo Cliente'">Título</h4>
    <div class="card border-0 shadow-sm p-4" style="max-width: 600px;">
        <form th:action="@{/app/clientes/guardar}" method="post">
            <input type="hidden" name="id" th:value="${cliente.id}">

            <div class="mb-3">
                <label class="form-label">Tipo de Documento</label>
                <select class="form-select" name="tipo_documento" required>
                    <option value="DNI" th:selected="${cliente.tipo_documento} == 'DNI' or ${cliente.tipo_documento} == null">DNI</option>
                    <option value="CE" th:selected="${cliente.tipo_documento} == 'CE'">Carné de Extranjería</option>
                    <option value="PASAPORTE" th:selected="${cliente.tipo_documento} == 'PASAPORTE'">Pasaporte</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="numDocumento" class="form-label">N° Documento</label>
                <input type="text" class="form-control" id="numDocumento" name="num_documento" th:value="${cliente.num_documento}" required>
            </div>
            <div class="mb-3">
                <label for="nombres" class="form-label">Nombres</label>
                <input type="text" class="form-control" id="nombres" name="nombres" th:value="${cliente.nombres}" required>
            </div>
            <div class="mb-3">
                <label for="apellidos" class="form-label">Apellidos</label>
                <input type="text" class="form-control" id="apellidos" name="apellidos" th:value="${cliente.apellidos}" required>
            </div>
            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="text" class="form-control" id="telefono" name="telefono" th:value="${cliente.telefono}">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" th:value="${cliente.email}">
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">Guardar</button>
                <a th:href="@{/app/clientes}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</main>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
