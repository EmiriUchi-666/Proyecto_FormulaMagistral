<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout('Receta', 'recetas')}">
<body>
<main th:fragment="content">
    <h4 class="mb-4">Nueva Receta</h4>
    <div class="card border-0 shadow-sm p-4" style="max-width: 600px;">
        <form th:action="@{/recetas/guardar}" th:object="${receta}" method="post">
            <div class="mb-3">
                <label class="form-label">N° Receta</label>
                <input type="text" class="form-control" th:field="*{num_receta}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Cliente</label>
                <input type="text" class="form-control" th:field="*{cliente}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Médico</label>
                <input type="text" class="form-control" th:field="*{medico}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Fecha de Emisión</label>
                <input type="date" class="form-control" th:field="*{fecha_emision}" required>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">Guardar</button>
                <a th:href="@{/recetas}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
