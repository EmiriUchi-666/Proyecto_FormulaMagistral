<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es"
      th:fragment="layout(titulo, pagina)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
    <title th:text="${titulo} + ' | FarmaPrep'">FarmaPrep</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- Sidebar -->
    <nav class="sidebar d-flex flex-column p-3" id="sidebar">
        <a th:href="@{/app/}" class="d-flex align-items-center mb-4 text-decoration-none text-success fw-bold fs-4">
            <i class="bi bi-capsule me-2"></i> FarmaPrep
        </a>
        <ul class="nav flex-column mb-auto">
            <li class="nav-item">
                <a th:href="@{/app/}" th:classappend="${pagina != null and #strings.startsWith(pagina,'dashboard')} ? 'active' : ''" class="nav-link">
                    <i class="bi bi-speedometer2"></i> Principal
                </a>
            </li>
            <li class="nav-item mt-3 text-uppercase text-muted small fw-bold px-3">Laboratorio</li>
            <li>
                <a th:href="@{/app/formulas}" th:classappend="${pagina != null and #strings.startsWith(pagina,'formulas')} ? 'active' : ''" class="nav-link">
                    <i class="bi bi-journal-medical"></i> Fórmulas
                </a>
            </li>
            <li>
                <a th:href="@{/app/ordenes}" th:classappend="${pagina != null and #strings.startsWith(pagina,'ordenes')} ? 'active' : ''" class="nav-link">
                    <i class="bi bi-clipboard2-pulse"></i> Órdenes
                </a>
            </li>
            <li>
                <a th:href="@{/app/inventario}" th:classappend="${pagina != null and #strings.startsWith(pagina,'inventario')} ? 'active' : ''" class="nav-link">
                    <i class="bi bi-box-seam"></i> Inventario
                </a>
            </li>
            <li class="nav-item mt-3 text-uppercase text-muted small fw-bold px-3">Negocio</li>
            <li>
                <a th:href="@{/app/clientes}" th:classappend="${pagina != null and #strings.startsWith(pagina,'clientes')} ? 'active' : ''" class="nav-link">
                    <i class="bi bi-people"></i> Clientes
                </a>
            </li>
            <li>
                <a th:href="@{/app/citas}" th:classappend="${pagina != null and #strings.startsWith(pagina,'citas')} ? 'active' : ''" class="nav-link">
                    <i class="bi bi-calendar2-heart"></i> Citas Médicas
                </a>
            </li>
            <li>
                <a th:href="@{/app/ventas}" th:classappend="${pagina != null and #strings.startsWith(pagina,'ventas')} ? 'active' : ''" class="nav-link">
                    <i class="bi bi-cart3"></i> Ventas
                </a>
            </li>
            <li sec:authorize="hasRole('ADMIN')" class="nav-item mt-3 text-uppercase text-muted small fw-bold px-3">Administración</li>
            <li sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/app/recetas}" th:classappend="${pagina != null and #strings.startsWith(pagina,'recetas')} ? 'active' : ''" class="nav-link">
                    <i class="bi bi-file-earmark-text"></i> Recetas
                </a>
            </li>
            <li sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/app/usuarios}" th:classappend="${pagina != null and #strings.startsWith(pagina,'usuarios')} ? 'active' : ''" class="nav-link">
                    <i class="bi bi-shield-lock"></i> Usuarios
                </a>
            </li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Topbar -->
        <header class="topbar d-flex justify-content-between align-items-center">
            <button class="btn btn-sm btn-outline-secondary d-md-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar">
                <i class="bi bi-list"></i>
            </button>
            <div class="input-group d-none d-md-flex" style="max-width: 400px;">
                <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-search"></i></span>
                <input type="text" id="globalSearch" class="form-control border-start-0" placeholder="Buscar (Ctrl+K)...">
            </div>
            <div class="d-flex align-items-center gap-3">
                <button id="themeToggle" class="btn btn-light"><i class="bi bi-moon-stars"></i></button>
                <div class="dropdown">
                    <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle text-dark" data-bs-toggle="dropdown">
                        <div class="bg-success text-white rounded-circle d-flex align-items-center justify-content-center me-2" style="width:32px;height:32px;">
                            <span th:text="${#strings.toUpperCase(#strings.substring(#authentication.name, 0, 1))}"></span>
                        </div>
                        <span sec:authentication="name" class="fw-semibold d-none d-sm-inline"></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <form th:action="@{/app/logout}" method="post">
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </header>

        <!-- Content -->
        <main th:replace="${pagina} :: content">Contenido</main>

        <!-- Toasts -->
        <div class="toast-container position-fixed bottom-0 end-0 p-3">
            <div th:if="${success}" class="toast show align-items-center text-bg-success border-0" role="alert">
                <div class="d-flex">
                    <div class="toast-body">
                        <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            </div>
            <div th:if="${error}" class="toast show align-items-center text-bg-danger border-0" role="alert">
                <div class="d-flex">
                    <div class="toast-body">
                        <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <th:block th:replace="${pagina} :: scripts"></th:block>
</body>
</html>
