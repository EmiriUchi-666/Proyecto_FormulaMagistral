<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout('Citas Médicas', 'citas/list')}">
<body>
<main th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4>Citas Médicas</h4>
        <a th:href="@{/app/citas/nuevo}" class="btn btn-success btn-sm">
            <i class="bi bi-plus-lg"></i> Nueva Cita
        </a>
    </div>
    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <div th:if="${#lists.isEmpty(citas)}" class="text-center py-5 text-muted">
                <i class="bi bi-calendar2-heart display-4"></i>
                <p class="mt-2">No hay citas registradas.</p>
            </div>
            <div th:unless="${#lists.isEmpty(citas)}" class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr><th>ID</th><th>Paciente</th><th>Fecha y Hora</th><th>Motivo</th><th>Estado</th><th class="text-end">Acciones</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${citas}">
                            <td th:text="${c.id}"></td>
                            <td th:text="${c.paciente}"></td>
                            <td th:text="${c.fecha_hora}"></td>
                            <td th:text="${c.motivo}"></td>
                            <td>
                                <span class="badge" th:classappend="'badge-estado-' + ${#strings.toLowerCase(c.estado)}" th:text="${c.estado}"></span>
                            </td>
                            <td class="text-end">
                                <button th:data-url="@{/app/citas/eliminar/{id}(id=${c.id})}" th:data-nombre="${c.paciente}" onclick="confirmarEliminar(this.dataset.url, this.dataset.nombre)" class="btn btn-sm btn-light text-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
