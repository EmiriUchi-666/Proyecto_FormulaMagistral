<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout('Cita Médica', 'citas/form')}">
<body>
<main th:fragment="content">
    <h4 class="mb-4">Nueva Cita Médica</h4>
    <div class="card border-0 shadow-sm p-4" style="max-width: 600px;">
        <form th:action="@{/app/citas/guardar}" method="post">
            <div class="mb-3">
                <label class="form-label">Paciente</label>
                <select class="form-select" name="idPaciente" required>
                    <option value="">Seleccione un paciente</option>
                    <option th:each="p : ${pacientes}" th:value="${p.idPaciente}" th:text="${p.nombres} + ' ' + ${p.apellidos}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Fecha y Hora</label>
                <input type="datetime-local" class="form-control" name="fechaHora" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Motivo</label>
                <input type="text" class="form-control" name="motivo" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Estado</label>
                <select class="form-select" name="estado" required>
                    <option value="PROGRAMADA">Programada</option>
                    <option value="ATENDIDA">Atendida</option>
                    <option value="CANCELADA">Cancelada</option>
                </select>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">Guardar</button>
                <a th:href="@{/app/citas}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</main>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
