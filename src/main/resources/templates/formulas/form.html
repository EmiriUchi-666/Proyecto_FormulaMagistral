<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout('Fórmula', 'formulas/form')}">
<body>
<main th:fragment="content">
    <h4 class="mb-4">Nueva Fórmula</h4>
    <div class="card border-0 shadow-sm p-4" style="max-width: 600px;">
        <form th:action="@{/app/formulas/guardar}" method="post">
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" name="nombre" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Categoría</label>
                <select class="form-select" name="idCategoria" required>
                    <option value="">Seleccione una categoría</option>
                    <option th:each="cat : ${categorias}" th:value="${cat.idCategoria}" th:text="${cat.nombre}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Presentación</label>
                <input type="text" class="form-control" name="presentacion" placeholder="Ej: Crema 30g">
            </div>
            <div class="mb-3">
                <label class="form-label">Precio de Venta</label>
                <input type="number" step="0.01" class="form-control" name="precioVenta" required>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="requiereReceta" name="requiereReceta" value="true" checked>
                <label class="form-check-label" for="requiereReceta">Requiere receta médica</label>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">Guardar</button>
                <a th:href="@{/app/formulas}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</main>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
