<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout('Fórmulas', 'formulas/list')}">
<body>
<main th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4>Fórmulas Magistrales</h4>
        <a th:href="@{/app/formulas/nuevo}" class="btn btn-success btn-sm">
            <i class="bi bi-plus-lg"></i> Nueva Fórmula
        </a>
    </div>
    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <div th:if="${#lists.isEmpty(formulas)}" class="text-center py-5 text-muted">
                <i class="bi bi-journal-medical display-4"></i>
                <p class="mt-2">No hay fórmulas registradas.</p>
            </div>
            <div th:unless="${#lists.isEmpty(formulas)}" class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr><th>ID</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th class="text-end">Acciones</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="f : ${formulas}">
                            <td th:text="${f.id}"></td>
                            <td th:text="${f.nombre}"></td>
                            <td th:text="${f.categoria}"></td>
                            <td th:text="'S/ ' + ${f.precio_venta}"></td>
                            <td class="text-end">
                                <button th:onclick="'confirmarEliminar(\'/app/formulas/eliminar/' + ${f.id} + '\', \'' + ${f.nombre} + '\')'" class="btn btn-sm btn-light text-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
