<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout('Usuarios', 'usuarios/list')}">
<body>
<main th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4>Usuarios</h4>
        <a th:href="@{/app/usuarios/nuevo}" class="btn btn-success btn-sm">
            <i class="bi bi-plus-lg"></i> Nuevo Usuario
        </a>
    </div>
    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <div th:if="${#lists.isEmpty(usuarios)}" class="text-center py-5 text-muted">
                <i class="bi bi-shield-lock display-4"></i>
                <p class="mt-2">No hay usuarios registrados.</p>
            </div>
            <div th:unless="${#lists.isEmpty(usuarios)}" class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr><th>ID</th><th>Email</th><th>Nombres</th><th>Rol</th><th class="text-end">Acciones</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${usuarios}">
                            <td th:text="${u.id}"></td>
                            <td th:text="${u.email}"></td>
                            <td th:text="${u.nombres}"></td>
                            <td><span class="badge bg-primary" th:text="${u.rol}"></span></td>
                                                        <td class="text-end">

                               <button th:if="${u.rol != 'ADMIN'}"
                                th:data-url="@{/app/usuarios/eliminar/{id}(id=${u.id})}" 
                                th:data-nombre="${u.email}" 
                                onclick="confirmarEliminar(this.dataset.url, this.dataset.nombre)" 
                                class="btn btn-sm btn-light text-danger">

                                </button>

                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
