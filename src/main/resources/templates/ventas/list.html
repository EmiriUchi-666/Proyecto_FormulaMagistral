<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout('Ventas', 'ventas/list')}">
<body>
<main th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4>Ventas</h4>
        <div class="d-flex gap-2">
            <a th:href="@{/app/ventas/nuevo}" class="btn btn-success btn-sm">
                <i class="bi bi-plus-lg"></i> Nueva Venta
            </a>
        </div>
    </div>
    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <div th:if="${#lists.isEmpty(ventas)}" class="text-center py-5 text-muted">
                <i class="bi bi-cart3 display-4"></i>
                <p class="mt-2">No hay ventas registradas.</p>
            </div>
            <div th:unless="${#lists.isEmpty(ventas)}" class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr><th>ID</th><th>Cliente</th><th>Total</th><th>Fecha</th><th>Estado</th><th class="text-end">Acciones</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="v : ${ventas}">
                            <td th:text="${v.id}"></td>
                            <td th:text="${v.cliente}"></td>
                            <td th:text="'S/ ' + ${v.total}"></td>
                            <td th:text="${v.fecha}"></td>
                            <td>
                                <span class="badge" th:classappend="'badge-estado-' + ${#strings.toLowerCase(v.estado)}" th:text="${v.estado}"></span>
                            </td>
                            <td class="text-end">
                                <a th:href="@{/app/ventas/{id}/ticket(id=${v.id})}" class="btn btn-sm btn-light" target="_blank">
                                    <i class="bi bi-printer"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
