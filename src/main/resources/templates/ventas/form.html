<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout('Nueva Venta', 'ventas/form')}">

<body>

<main th:fragment="content">

    <h4 class="mb-4">Nueva Venta</h4>


    <div class="alert alert-warning small mb-3">

        <i class="bi bi-info-circle"></i>

        Este formulario registra solo la cabecera de la venta.
        Agregar productos (líneas de detalle) requiere una orden de preparación real,
        que depende del módulo de <strong>Preparación</strong>.

    </div>



    <div class="card border-0 shadow-sm p-4" style="max-width:600px;">

        <form th:action="@{/app/ventas/guardar}" method="post">


            <!-- PACIENTE -->

            <div class="mb-3">

                <label class="form-label">
                    Paciente
                </label>


                <select class="form-select"
                        name="idPaciente"
                        required>

                    <option value="">
                        Seleccione un paciente
                    </option>


                    <option th:each="p : ${pacientes}"
                            th:value="${p.idPaciente}"
                            th:text="${p.nombres + ' ' + p.apellidos}">
                    </option>


                </select>

            </div>



            <!-- COMPROBANTE -->

            <div class="mb-3">

                <label class="form-label">
                    Tipo de Comprobante
                </label>


                <select class="form-select"
                        name="tipoComprobante"
                        required>


                    <option value="BOLETA">
                        Boleta
                    </option>


                    <option value="FACTURA">
                        Factura
                    </option>


                </select>

            </div>




            <!-- NUMERO -->

            <div class="mb-3">

                <label class="form-label">
                    N° de Comprobante
                </label>


                <input type="text"
                       class="form-control"
                       name="numComprobante"
                       placeholder="B001-0001">

            </div>




            <!-- TOTAL -->

            <div class="mb-3">

                <label class="form-label">
                    Total
                </label>


                <input type="number"
                       step="0.01"
                       class="form-control"
                       name="total"
                       required>

            </div>




            <div class="d-flex gap-2">

                <button type="submit"
                        class="btn btn-success">

                    Guardar

                </button>


                <a th:href="@{/app/ventas}"
                   class="btn btn-outline-secondary">

                    Cancelar

                </a>


            </div>



        </form>


    </div>


</main>


<th:block th:fragment="scripts"></th:block>


</body>

</html>
