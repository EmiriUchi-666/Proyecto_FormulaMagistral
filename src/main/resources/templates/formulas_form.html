<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout('Fórmula', 'formulas')}">
<body>
<main th:fragment="content">
    <h4 class="mb-4">Nueva Fórmula</h4>
    <div class="card border-0 shadow-sm p-4" style="max-width: 600px;">
        <form th:action="@{/formulas/guardar}" th:object="${formula}" method="post">
            <div class="mb-3">
                <label class="form-label">Código</label>
                <input type="text" class="form-control" th:field="*{codigo}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" th:field="*{nombre}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Categoría</label>
                <input type="text" class="form-control" th:field="*{categoria}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Precio de Venta</label>
                <input type="number" step="0.01" class="form-control" th:field="*{precio_venta}" required>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">Guardar</button>
                <a th:href="@{/formulas}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
