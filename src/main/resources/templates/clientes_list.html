<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout('Clientes', 'clientes')}">
<body>
<main th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4>Clientes</h4>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-success btn-sm" onclick="exportarCSV([{id:1,doc:'72345678',nombre:'Juan'}], 'clientes')">
                <i class="bi bi-file-earmark-spreadsheet"></i> CSV
            </button>
            <a th:href="@{/clientes/nuevo}" class="btn btn-success btn-sm">
                <i class="bi bi-plus-lg"></i> Nuevo Cliente
            </a>
        </div>
    </div>
    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <div th:if="${#lists.isEmpty(clientes)}" class="text-center py-5 text-muted">
                <i class="bi bi-people display-4"></i>
                <p class="mt-2">No hay clientes registrados.</p>
                <a th:href="@{/clientes/nuevo}" class="btn btn-sm btn-outline-success">Registrar el primero</a>
            </div>
            <div th:unless="${#lists.isEmpty(clientes)}" class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr><th>ID</th><th>Documento</th><th>Nombres</th><th class="text-end">Acciones</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${clientes}">
                            <td th:text="${c.id}"></td>
                            <td th:text="${c.num_documento}"></td>
                            <td th:text="${c.nombres}"></td>
                            <td class="text-end">
                                <a th:href="@{/clientes/editar/{id}(id=${c.id})}" class="btn btn-sm btn-light">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <button th:onclick="'confirmarEliminar(\'/clientes/eliminar/' + ${c.id} + '\', \'' + ${c.nombres} + '\')'" class="btn btn-sm btn-light text-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <nav th:if="${totalPages > 1}" class="mt-3">
                <ul class="pagination justify-content-center mb-0">
                    <li class="page-item" th:classappend="${page == 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/clientes(page=${page - 1}, q=${q})}">Anterior</a>
                    </li>
                    <li class="page-item" th:each="p : ${#numbers.sequence(1, totalPages)}" th:classappend="${p == page} ? 'active'">
                        <a class="page-link" th:href="@{/clientes(page=${p}, q=${q})}" th:text="${p}"></a>
                    </li>
                    <li class="page-item" th:classappend="${page == totalPages} ? 'disabled'">
                        <a class="page-link" th:href="@{/clientes(page=${page + 1}, q=${q})}">Siguiente</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</main>
</body>
</html>
