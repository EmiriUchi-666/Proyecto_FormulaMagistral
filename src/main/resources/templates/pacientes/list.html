<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout('Pacientes', 'pacientes/list')}">
<body>
<main th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4>Pacientes</h4>
        <div class="d-flex gap-2">
            <a th:href="@{/app/pacientes/nuevo}" class="btn btn-success btn-sm">
                <i class="bi bi-plus-lg"></i> Nuevo Paciente
            </a>
        </div>
    </div>
    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <div th:if="${#lists.isEmpty(pacientes)}" class="text-center py-5 text-muted">
                <i class="bi bi-people display-4"></i>
                <p class="mt-2">No hay pacientes registrados.</p>
                <a th:href="@{/app/pacientes/nuevo}" class="btn btn-sm btn-outline-success">Registrar el primero</a>
            </div>
            <div th:unless="${#lists.isEmpty(pacientes)}" class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr><th>ID</th><th>Documento</th><th>Nombres</th><th class="text-end">Acciones</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${pacientes}">
                            <td th:text="${c.idPaciente}"></td>
                            <td th:text="${c.numDocumento}"></td>
                            <td th:text="${c.nombres}"></td>
                            <td class="text-end">
                                <a th:href="@{/app/pacientes/editar/{id}(id=${c.idPaciente})}" class="btn btn-sm btn-light">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <button th:data-url="@{/app/pacientes/eliminar/{id}(id=${c.idPaciente})}" th:data-nombre="${c.nombres}" onclick="confirmarEliminar(this.dataset.url, this.dataset.nombre)" class="btn btn-sm btn-light text-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <nav th:if="${totalPages > 1}" class="mt-3">
                <ul class="pagination justify-content-center mb-0">
                    <li class="page-item" th:classappend="${page == 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/app/pacientes(page=${page - 1}, q=${q})}">Anterior</a>
                    </li>
                    <li class="page-item" th:each="p : ${#numbers.sequence(1, totalPages)}" th:classappend="${p == page} ? 'active'">
                        <a class="page-link" th:href="@{/app/pacientes(page=${p}, q=${q})}" th:text="${p}"></a>
                    </li>
                    <li class="page-item" th:classappend="${page == totalPages} ? 'disabled'">
                        <a class="page-link" th:href="@{/app/pacientes(page=${page + 1}, q=${q})}">Siguiente</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</main>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
